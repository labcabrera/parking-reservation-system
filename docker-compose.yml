# ---------------------------------------------------------------------------
# Parking Reservation System — Full Local Stack
# ---------------------------------------------------------------------------

services:
  # -----------------------------------------------------------------------
  # Infrastructure: PostgreSQL
  # -----------------------------------------------------------------------
  postgres:
    profiles: [infrastructure, apps]
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------------------
  # Infrastructure: Redis
  # -----------------------------------------------------------------------
  redis:
    profiles: [infrastructure, apps]
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------------
  # Infrastructure: Kafka (KRaft mode — no ZooKeeper)
  # -----------------------------------------------------------------------
  kafka:
    profiles: [infrastructure, apps]
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://parking-reservation-system-kafka-1:9092,PLAINTEXT_HOST://localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@parking-reservation-system-kafka-1:9094"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    profiles: [infrastructure, apps]
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/init-topics.sh:ro
    restart: "no"

  # -----------------------------------------------------------------------
  # Infrastructure: Kafka UI
  # -----------------------------------------------------------------------
  kafka-ui:
    profiles: [infrastructure, apps]
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # Infrastructure: Keycloak
  # -----------------------------------------------------------------------
  keycloak:
    profiles: [infrastructure, apps]
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Observability: OpenTelemetry Collector
  # -----------------------------------------------------------------------
  otel-collector:
    profiles: [infrastructure, apps]
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # -----------------------------------------------------------------------
  # Infrastructure: Spring Cloud Config Server
  # -----------------------------------------------------------------------
  prs-ms-config-server:
    profiles: [infrastructure, apps]
    build:
      context: .
      dockerfile: prs-ms-config-server/Dockerfile
    environment:
      CONFIG_GIT_URI: ${CONFIG_SERVER_REPOSITORY}
      CONFIG_GIT_DEFAULT_LABEL: ${CONFIG_SERVER_DEFAULT_LABEL}
      CONFIG_GIT_CLONE_ON_START: true
      CONFIG_GIT_FORCE_PULL: true
      CONFIG_GIT_SEARCH_PATHS: ${CONFIG_SERVER_SEARCH_PATHS}
    ports:
      - "8888:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8888/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Microservice Parking Facilities
  # -----------------------------------------------------------------------
  prs-ms-parking-facilities:
    profiles: [apps]
    build:
      context: .
      dockerfile: prs-ms-parking-facilities/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/facilities_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      CLOUD_CONFIG_SERVER_URI: ${CLOUD_CONFIG_SERVER_URI}
      FACILITIES_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:5173,http://192.168.1.107:3000,http://192.168.1.107:3001,http://192.168.1.107:3002,http://192.168.1.107:3003,http://192.168.1.107:5173
      FACILITIES_CORS_ALLOWED_ORIGIN_PATTERNS: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: prs-ms-parking-facilities
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prs-ms-config-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Microservice Ecommerce
  # -----------------------------------------------------------------------
  prs-ms-ecommerce:
    profiles: [apps]
    build:
      context: .
      dockerfile: prs-ms-ecommerce/Dockerfile
    environment:
      CLOUD_CONFIG_SERVER_URI: http://prs-ms-config-server:8888
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: prs-ms-ecommerce
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prs-ms-config-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8082/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Microservice Pricing
  # -----------------------------------------------------------------------
  prs-ms-pricing:
    profiles: [apps]
    build:
      context: .
      dockerfile: prs-ms-pricing/Dockerfile
    environment:
      CLOUD_CONFIG_SERVER_URI: http://prs-ms-config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricing_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: prs-ms-pricing
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prs-ms-config-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8083/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Microservice Geo
  # -----------------------------------------------------------------------
  prs-ms-geo:
    profiles: [apps]
    build:
      context: .
      dockerfile: prs-ms-geo/Dockerfile
    environment:
      CLOUD_CONFIG_SERVER_URI: http://prs-ms-config-server:8888
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: prs-ms-geo
    ports:
      - "8084:8084"
    depends_on:
      prs-ms-config-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8084/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Microservice BFF
  # -----------------------------------------------------------------------
  prs-ms-bff:
    profiles: [apps]
    build:
      context: .
      dockerfile: prs-ms-bff/Dockerfile
    environment:
      CLOUD_CONFIG_SERVER_URI: http://prs-ms-config-server:8888
      FACILITIES_SERVICE_URL: http://prs-ms-parking-facilities:8081
      ECOMMERCE_SERVICE_URL: http://prs-ms-ecommerce:8082
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      OIDC_ISSUER_URI: http://keycloak:8080/realms/parking
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: prs-ms-bff
    ports:
      - "8085:8085"
    depends_on:
      keycloak:
        condition: service_healthy
      prs-ms-config-server:
        condition: service_healthy
      prs-ms-parking-facilities:
        condition: service_healthy
      prs-ms-ecommerce:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8085/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Microservice Users
  # -----------------------------------------------------------------------
  prs-ms-users:
    profiles: [apps]
    build:
      context: .
      dockerfile: prs-ms-users/Dockerfile
    environment:
      CLOUD_CONFIG_SERVER_URI: http://prs-ms-config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      OIDC_ISSUER_URI: http://keycloak:8080/realms/parking
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: prs-ms-users
    ports:
      - "8086:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prs-ms-config-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8083/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Frontend: Main SPA
  # -----------------------------------------------------------------------
  frontend:
    profiles: [apps]
    build:
      context: prs-frontend
      dockerfile: Dockerfile
      args:
        VITE_BFF_URL: http://localhost:8085
        VITE_PARKING_FACILITIES_SERVICE_URL: http://localhost:8081
        VITE_PRICING_SERVICE_URL: http://localhost:8083
        VITE_ECOMMERCE_SERVICE_URL: http://localhost:8082
        VITE_PAYMENT_GATEWAY_URL: http://localhost:3001
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: parking
        VITE_KEYCLOAK_CLIENT_ID: parking-client-front
        VITE_KEYCLOAK_SCOPE: openid profile email
    environment:
      VITE_CATALOG_SERVICE_URL: ""
      VITE_PAYMENT_GATEWAY_URL: http://localhost:3001
    ports:
      - "3000:80"

  # -----------------------------------------------------------------------
  # Mock Payment API
  # -----------------------------------------------------------------------
  prs-mock-ms-payment:
    profiles: [apps]
    build:
      context: .
      dockerfile: prs-mock-ms-payment/Dockerfile
    ports:
      - "8089:8089"

  # -----------------------------------------------------------------------
  # Frontend: Payment Gateway SPA
  # -----------------------------------------------------------------------
  payment-gateway:
    profiles: [apps]
    build:
      context: prs-mock-payment-gateway
      dockerfile: Dockerfile
    environment:
      VITE_PAYMENT_SERVICE_URL: ""
    ports:
      - "3001:80"
    depends_on:
      - prs-mock-ms-payment

  # -----------------------------------------------------------------------
  # Observability: Prometheus
  # -----------------------------------------------------------------------
  prometheus:
    profiles: [observability]
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # -----------------------------------------------------------------------
  # Observability: Grafana
  # -----------------------------------------------------------------------
  grafana:
    profiles: [observability]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
