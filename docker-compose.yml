# ---------------------------------------------------------------------------
# Parking Reservation System — Full Local Stack
# Run: docker compose up --build
# All services reach healthy state within ~90 seconds on a modern laptop.
# ---------------------------------------------------------------------------

x-service-common: &service-common
  restart: unless-stopped

services:
  # -----------------------------------------------------------------------
  # Infrastructure: PostgreSQL (one instance, three databases)
  # -----------------------------------------------------------------------
  postgres:
    <<: *service-common
    profiles: [infrastructure]
    image: postgres:17
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking}
      POSTGRES_DB: prs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------------------
  # Infrastructure: Redis
  # -----------------------------------------------------------------------
  redis:
    <<: *service-common
    profiles: [infrastructure]
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------------
  # Infrastructure: Kafka (KRaft mode — no ZooKeeper)
  # -----------------------------------------------------------------------
  kafka:
    <<: *service-common
    profiles: [infrastructure]
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://parking-reservation-system-kafka-1:9092,PLAINTEXT_HOST://localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@parking-reservation-system-kafka-1:9094"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infrastructure/kafka/init-topics.sh:/docker-entrypoint-init.d/init-topics.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    profiles: [infrastructure]
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/init-topics.sh:ro
    restart: "no"

  # -----------------------------------------------------------------------
  # Infrastructure: Kafka UI
  # -----------------------------------------------------------------------
  kafka-ui:
    <<: *service-common
    profiles: [infrastructure]
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # Infrastructure: Keycloak
  # -----------------------------------------------------------------------
  keycloak:
    <<: *service-common
    profiles: [infrastructure]
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev
    # command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    # volumes:
    #   - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Backend: Catalog Service
  # -----------------------------------------------------------------------
  catalog-service:
    <<: *service-common
    profiles: [apps]
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: parking
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-parking}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_FLYWAY_SCHEMAS: catalog
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: catalog-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Backend: Reservation Service
  # -----------------------------------------------------------------------
  reservation-service:
    <<: *service-common
    profiles: [apps]
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservation_db
      SPRING_DATASOURCE_USERNAME: parking
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-parking}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/parking
      SPRING_FLYWAY_SCHEMAS: reservation
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-change-me}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: reservation-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8082/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Backend: Payment Service
  # -----------------------------------------------------------------------
  payment-service:
    <<: *service-common
    profiles: [apps]
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: parking
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-parking}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_FLYWAY_SCHEMAS: payment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: payment-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8083/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Frontend: Main SPA
  # -----------------------------------------------------------------------
  frontend:
    <<: *service-common
    profiles: [apps]
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      VITE_CATALOG_SERVICE_URL: ""
      VITE_PAYMENT_GATEWAY_URL: http://localhost:3001
    ports:
      - "3000:80"

  # -----------------------------------------------------------------------
  # Frontend: Payment Gateway SPA
  # -----------------------------------------------------------------------
  payment-gateway:
    <<: *service-common
    profiles: [apps]
    build:
      context: payment-gateway
      dockerfile: Dockerfile
    environment:
      VITE_PAYMENT_SERVICE_URL: ""
    ports:
      - "3001:80"

  # -----------------------------------------------------------------------
  # Observability: OpenTelemetry Collector
  # -----------------------------------------------------------------------
  otel-collector:
    <<: *service-common
    profiles: [apps]
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # -----------------------------------------------------------------------
  # Observability: Prometheus
  # -----------------------------------------------------------------------
  prometheus:
    <<: *service-common
    profiles: [apps]
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # -----------------------------------------------------------------------
  # Observability: Grafana
  # -----------------------------------------------------------------------
  grafana:
    <<: *service-common
    profiles: [apps]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
