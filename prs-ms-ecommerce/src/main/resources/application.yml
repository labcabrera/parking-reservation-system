server:
  port: 8082

spring:
  application:
    name: prs-ms-ecommerce
  config:
    import:
      - classpath:application-axon.yml
      - classpath:application-cloud-stream.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      #ddl-auto: none
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        #default_schema: ecommerce
        format_sql: true
        highlight_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: default
      password: ${REDIS_PASSWORD:redis_pass}

#  kafka:
