server:
  port: 8081

spring:
  application:
    name: prs-ms-parking-facilities
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/facilities_db}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
    driver-class-name: org.postgresql.Driver
  cloud:
    stream:
      default-binder: kafka
      bindings:
        reservationCreated-out-0:
          destination: parking-facilities.reservation.created.v1
          content-type: application/json
      kafka:
        bindings:
          reservationCreated-out-0:
            producer:
              configuration:
                acks: all
                enable.idempotence: true
                key.serializer: org.apache.kafka.common.serialization.StringSerializer

catalog:
  search:
    max-page-size: 100
    default-limit: 20
    low-availability-threshold: 5
  cache:
    facility-ttl-seconds: 300
  reservation:
    hold-minutes: 5
    slot-size-minutes: 30
    short-duration-threshold-hours: 12

facilities:
  security:
    cors:
      allowed-origins: ${FACILITIES_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:5173,http://192.168.1.107:3000,http://192.168.1.107:3001,http://192.168.1.107:3002,http://192.168.1.107:3003,http://192.168.1.107:5173}
      allowed-origin-patterns: ${FACILITIES_CORS_ALLOWED_ORIGIN_PATTERNS:}
