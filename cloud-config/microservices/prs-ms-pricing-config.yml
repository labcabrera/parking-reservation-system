server:
  port: 8083

spring:
  application:
    name: prs-ms-pricing
  datasource:
    url: jdbc:postgresql://localhost:5432/pricing_db
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
    driver-class-name: org.postgresql.Driver
  cloud:
    function:
      definition: updatedParkingFacilityCapacityConsumer
    stream:
      default-binder: kafka
      bindings:
        updatedParkingFacilityCapacityConsumer-in-0:
          destination: parking-facilities.capacity.updated.v1
          group: prs-ms-pricing
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        bindings:
          updatedParkingFacilityCapacityConsumer-in-0:
            consumer:
              autoCommitOffset: true
