
server:
  port: 8085
  servlet:
    session:
      cookie:
        name: BFF_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: prs-bff-service

  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri is used to fetch signing keys (Docker-internal hostname works here).
          # issuer-uri is only used as the expected value of the "iss" claim validator;
          # Spring does NOT call the OIDC discovery endpoint when jwk-set-uri is also present.
          # This allows the BFF to validate tokens whose "iss" was set by Keycloak using the
          # browser-visible hostname (localhost) while fetching keys via the Docker network.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/parking/protocol/openid-connect/certs}
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/parking}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: bff-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer


bff:
  clients:
    facilities:
      url: ${FACILITIES_SERVICE_URL:http://localhost:8081}
    ecommerce:
      url: ${ECOMMERCE_SERVICE_URL:http://localhost:8082}
  security:
    cors:
      allowed-origins: ${BFF_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

