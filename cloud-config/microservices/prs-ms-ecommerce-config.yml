server:
  port: 8082

spring:
  application:
    name: prs-ms-ecommerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
    driver-class-name: org.postgresql.Driver
  cloud:
    function:
      definition: reservationCreatedConsumer
    stream:
      default-binder: kafka
      bindings:
        reservationCreatedConsumer-in-0:
          destination: parking-facilities.reservation.created.v1
          group: prs-ms-ecommerce
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        bindings:
          reservationCreatedConsumer-in-0:
            consumer:
              autoCommitOffset: true

ecommerce:
  order:
    ttl-minutes: 15
  payment:
    gateway: mock
    mock:
      base-url: ${MOCK_PAYMENT_API_URL:http://localhost:8089}
      customer-callback-url: ${MOCK_PAYMENT_CUSTOMER_CALLBACK_URL:http://localhost:3001/payment-result}
      ecommerce-callback-url: ${MOCK_PAYMENT_ECOMMERCE_CALLBACK_URL:http://localhost:8082/api/v1/payment-callbacks/mock}
