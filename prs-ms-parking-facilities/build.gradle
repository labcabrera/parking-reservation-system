plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
    id 'org.openapi.generator' version '7.21.0'
}

ext {
  set('springCloudVersion', "${springCloudVersion}")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.axonframework:axon-spring-boot-starter:${axonVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testImplementation 'org.testcontainers:junit-jupiter'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:1.20.6"
    }
}


tasks.register('openApiGeneratePricingApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = "restclient"
	inputSpec = "$rootDir/prs-ms-parking-facilities/src/main/resources/api-clients/pricing-api.json"
	outputDir = "$buildDir/generated/sources/openapi/pricing-client"
	apiPackage = 'org.labcabrera.parking.facilities.generated.client.pricing.api'
	modelPackage = 'org.labcabrera.parking.facilities.generated.client.pricing.model'
	invokerPackage = 'org.labcabrera.parking.facilities.generated.client.pricing'
	configOptions = [
		useSpringBoot3          : 'false',
		useSpringBoot4          : 'true',
		interfaceOnly           : 'true',
		useJackson3             : "true",
		useJakartaEe            : "true",
		useJspecify		        : "true",
		useFeignClientUrls      : 'true',
		useFeignClientContextId : 'true',
		useTags                 : 'true',
		dateLibrary             : 'java8-localdatetime',
		openApiNullable         : 'false',
	]
	additionalProperties = [
		serializableModel: 'true'
	]
}

sourceSets.main.java.srcDir file("$buildDir/generated/sources/openapi/pricing-client/src/main/java")

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGeneratePricingApi')
}
