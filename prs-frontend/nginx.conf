server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → BFF (public booking/checkout/registration flow)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $bff_upstream http://prs-ms-bff:8085;
        proxy_pass $bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /admin-api/api/v1/parking-facilities → prs-ms-parking-facilities
    location /admin-api/api/v1/parking-facilities {
        resolver 127.0.0.11 valid=10s;
        set $facilities_upstream http://prs-ms-parking-facilities:8081;
        rewrite ^/admin-api(/.*)$ $1 break;
        proxy_pass $facilities_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /admin-api/api/v1/reservations → prs-ms-parking-facilities
    location /admin-api/api/v1/reservations {
        resolver 127.0.0.11 valid=10s;
        set $facilities_upstream http://prs-ms-parking-facilities:8081;
        rewrite ^/admin-api(/.*)$ $1 break;
        proxy_pass $facilities_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /admin-api/api/v1/pricing-rules → prs-ms-pricing
    location /admin-api/api/v1/pricing-rules {
        resolver 127.0.0.11 valid=10s;
        set $pricing_upstream http://prs-ms-pricing:8083;
        rewrite ^/admin-api(/.*)$ $1 break;
        proxy_pass $pricing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /admin-api/api/v1/orders → prs-ms-ecommerce
    location /admin-api/api/v1/orders {
        resolver 127.0.0.11 valid=10s;
        set $ecommerce_upstream http://prs-ms-ecommerce:8082;
        rewrite ^/admin-api(/.*)$ $1 break;
        proxy_pass $ecommerce_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint for Docker
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
