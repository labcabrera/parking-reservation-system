global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: prs-ms-parking-facilities
    static_configs:
      - targets: ['prs-ms-parking-facilities:8081']
    metrics_path: /actuator/prometheus

  - job_name: prs-ms-ecommerce
    static_configs:
      - targets: ['prs-ms-ecommerce:8082']
    metrics_path: /actuator/prometheus

  - job_name: prs-ms-pricing
    static_configs:
      - targets: ['prs-ms-parking-facilities:8083']
    metrics_path: /actuator/prometheus

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
