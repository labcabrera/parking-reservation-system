plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
    id 'org.openapi.generator' version '7.21.0'
}

ext {
  set('springCloudVersion', "${springCloudVersion}")
}

dependencies {
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:1.20.6"
    }
}

tasks.register('openApiGenerateFacilitiesApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = "restclient"
	inputSpec = "$rootDir/prs-ms-bff/src/main/resources/api-clients/facilities-api.json"
	outputDir = "$buildDir/generated/sources/openapi/facilities-client"
	apiPackage = 'org.labcabrera.parking.bff.generated.client.facilities.api'
	modelPackage = 'org.labcabrera.parking.bff.generated.client.facilities.model'
	invokerPackage = 'org.labcabrera.parking.bff.generated.client.facilities'
	configOptions = [
		useSpringBoot3          : 'false',
		useSpringBoot4          : 'true',
		interfaceOnly           : 'true',
		useJackson3             : "true",
		useJakartaEe            : "true",
		useJspecify		        : "true",
		useFeignClientUrls      : 'true',
		useFeignClientContextId : 'true',
		useTags                 : 'true',
		dateLibrary             : 'java8-localdatetime',
		openApiNullable         : 'false',
	]
	additionalProperties = [
		serializableModel: 'true'
	]
}


tasks.register('openApiGenerateEcommerceApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = "restclient"
	inputSpec = "$rootDir/prs-ms-bff/src/main/resources/api-clients/ecommerce-api.json"
	outputDir = "$buildDir/generated/sources/openapi/ecommerce-client"
	apiPackage = 'org.labcabrera.parking.bff.generated.client.ecommerce.api'
	modelPackage = 'org.labcabrera.parking.bff.generated.client.ecommerce.model'
	invokerPackage = 'org.labcabrera.parking.bff.generated.client.ecommerce'
	configOptions = [
		useSpringBoot3          : 'false',
		useSpringBoot4          : 'true',
		interfaceOnly           : 'true',
		useJackson3             : "true",
		useJakartaEe            : "true",
		useJspecify		        : "true",
		useFeignClientUrls      : 'true',
		useFeignClientContextId : 'true',
		useTags                 : 'true',
		dateLibrary             : 'java8-localdatetime',
		openApiNullable         : 'false',
	]
	additionalProperties = [
		serializableModel: 'true'
	]
}

sourceSets.main.java.srcDir file("$buildDir/generated/sources/openapi/facilities-client/src/main/java")
sourceSets.main.java.srcDir file("$buildDir/generated/sources/openapi/ecommerce-client/src/main/java")

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerateFacilitiesApi')
	dependsOn tasks.named('openApiGenerateEcommerceApi')
}
